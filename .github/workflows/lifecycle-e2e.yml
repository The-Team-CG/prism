name: Lifecycle E2E
on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
  pull_request:
    branches: [staging, main]
    paths:
      - .github/workflows/lifecycle-e2e.yml
      - scripts/e2e/lifecycle/prepare-ci.mjs
      - scripts/e2e/lifecycle/report-result.mjs
      - scripts/e2e/lifecycle/ci-configuration.test.mjs
permissions:
  contents: read
concurrency:
  group: lifecycle-e2e-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prism_ci
          POSTGRES_PASSWORD: prism_ci_ephemeral
          POSTGRES_DB: prism_e2e_flow
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U prism_ci -d prism_e2e_flow"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://prism_ci:prism_ci_ephemeral@127.0.0.1:55439/prism_e2e_flow
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'staging' || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node scripts/e2e/lifecycle/prepare-ci.mjs
      - run: node --test scripts/e2e/lifecycle/run.guard.test.mjs scripts/e2e/lifecycle/ci-configuration.test.mjs
      - run: npm --workspace prism-api run db:migrate:deploy
      - run: npm --workspace prism-api run db:seed -- --profile accounts --env-file "$PRISM_ENV_FILE"
      - run: npm --workspace prism-api run build
      - name: Start isolated API
        working-directory: apps/api
        run: |
          node scripts/run-with-env.mjs dist/apps/api/src/main.js >"$E2E_API_LOG" 2>../../.local-dev/lifecycle-ci-api.err.log &
          echo $! >../../.local-dev/lifecycle-ci-api.pid
      - name: Await API health
        run: |
          node --input-type=module <<'JS'
          for (let attempt = 0; attempt < 60; attempt++) {
            if (await fetch('http://localhost:4100/health').then(r => r.ok).catch(() => false)) process.exit(0);
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          throw new Error('Isolated API did not become healthy');
          JS
      - run: node --env-file="$PRISM_ENV_FILE" scripts/e2e/lifecycle/run.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lifecycle-report
          path: .local-dev/e2e-report/
          retention-days: 14
      - name: Stop isolated API
        if: always()
        run: |
          if test -f .local-dev/lifecycle-ci-api.pid; then kill "$(cat .local-dev/lifecycle-ci-api.pid)" || true; fi
