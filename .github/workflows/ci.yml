name: CI
on:
  pull_request:
    branches: [staging, prod, main]
  push:
    branches: [staging, prod, main]
permissions:
  contents: read
  security-events: write
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dependencies:
    name: Dependencies and test plan
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.tests.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          populate: 'true'
      - id: tests
        name: Select workspace test jobs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/workspace-tests.mjs --matrix
  validation:
    name: Node ${{ matrix.task }}
    needs: dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [checks, quality, build]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Keep ancestry for task selection and immutable-migration comparisons.
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/dependencies

      - name: Dependency audit
        if: matrix.task == 'checks'
        run: node scripts/npm-audit-ci.mjs

      # Repository-wide gates. They always run in full: migrations, persistence ownership, invariants and boundaries.
      - name: Repository checks
        if: matrix.task == 'checks'
        env:
          # Migrations already on the base branch must not change: a database that applied them would fail its ledger check.
          MIGRATION_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: >-
          npm run check:migrations && npm run check:migration-immutability && npm run check:domain-persistence && npm run check:invariants &&
          npm run check:test-clocks && npm run check:complexity && npm run check:boundaries

      - name: Lint and typecheck
        if: matrix.task == 'quality'
        run: node scripts/ci/run-tasks.mjs lint typecheck

      - name: Script and database guard tests
        if: matrix.task == 'checks'
        run: >-
          npm --workspace prism-api run test:fixtures:seed && npm run test:migrations && npm run test:domain-persistence && npm run test:invariants &&
          npm run test:test-clocks && npm --workspace prism-api run test:db:connection &&
          npm --workspace prism-api run test:db:preflight:quote-request-fk &&
          npm --workspace prism-api run test:db:schema-equivalence && npm run test:boundaries

      - name: CI selection and required-check behavior
        if: matrix.task == 'checks'
        run: npm run test:ci:guards

      - name: Build
        if: matrix.task == 'build'
        env:
          PRISM_VERCEL_SERVICES: "1"
        run: node scripts/ci/run-tasks.mjs build
  workspace-tests:
    name: Tests ${{ matrix.workspace }}
    needs: dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.dependencies.outputs.tests) }}
    env:
      CI: 'true'
      TEST_WORKSPACE: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
      # Separate machines avoid competing Vitest pools while preserving every suite and threshold.
      - name: Workspace suite with existing coverage gates
        run: node scripts/ci/workspace-tests.mjs
      - name: Upload workspace coverage
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: coverage-${{ matrix.id }}-${{ github.run_id }}
          path: |
            ${{ matrix.coverage }}
            !node_modules/**
          if-no-files-found: ignore
          retention-days: 7
  monorepo:
    name: Node CI
    if: always()
    needs: [dependencies, validation, workspace-tests, gitleaks, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Require every validation and security job
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/check-results.mjs dependencies validation workspace-tests gitleaks codeql
  cache-maintenance:
    name: Bound owned cache storage
    needs: monorepo
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Retire superseded owned caches without changing paid limits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/prune-caches.mjs
  gitleaks:
    uses: The-Team-CG/.github/.github/workflows/security-gitleaks.yml@v2
    secrets: inherit
  codeql:
    uses: The-Team-CG/.github/.github/workflows/security-codeql.yml@v2
    secrets: inherit
