name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  monorepo:
    uses: The-Team-CG/.github/.github/workflows/ci-node.yml@main
    with:
      working_directory: .
      node_version: "24"
      package_manager: npm
      install_command: npm ci
      typecheck_command: npm run typecheck
      test_command: npm run test:api:coverage && npm run test:coverage --workspace=@prism/client
      build_command: npm run build
    secrets: inherit

  gitleaks:
    uses: The-Team-CG/.github/.github/workflows/security-gitleaks.yml@main
    secrets: inherit

  codeql:
    uses: The-Team-CG/.github/.github/workflows/security-codeql.yml@main
    secrets: inherit

  sonar:
    needs: [monorepo, gitleaks]
    uses: The-Team-CG/.github/.github/workflows/sonar.yml@main
    with:
      project_key: The-Team-CG_prism
      project_name: prism
      working_directory: .
    secrets: inherit

  notify-failure:
    if: failure()
    needs: [monorepo, gitleaks, codeql, sonar]
    uses: The-Team-CG/.github/.github/workflows/notify.yml@main
    with:
      status: failure
      title: "CI failed - prism"
      environment: ci
    secrets: inherit
