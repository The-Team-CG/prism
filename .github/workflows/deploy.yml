name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  check-deploy-secrets:
    runs-on: ubuntu-latest
    outputs:
      staging_ready: ${{ steps.check.outputs.staging_ready }}
      production_ready: ${{ steps.check.outputs.production_ready }}
    steps:
      - id: check
        env:
          STAGING_HOOK: ${{ secrets.RENDER_PRISM_API_STAGING_DEPLOY_HOOK_URL }}
          PRODUCTION_HOOK: ${{ secrets.RENDER_PRISM_API_PRODUCTION_DEPLOY_HOOK_URL }}
          STAGING_URL: ${{ vars.PRISM_API_STAGING_URL }}
          PRODUCTION_URL: ${{ vars.PRISM_API_PRODUCTION_URL }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          echo "staging_ready=false" >> "$GITHUB_OUTPUT"
          echo "production_ready=false" >> "$GITHUB_OUTPUT"
          case "$HEAD_BRANCH" in
            staging)
              test -n "$STAGING_HOOK" || { echo "::error::RENDER_PRISM_API_STAGING_DEPLOY_HOOK_URL is required"; exit 1; }
              test -n "$STAGING_URL" || { echo "::error::PRISM_API_STAGING_URL is required"; exit 1; }
              echo "staging_ready=true" >> "$GITHUB_OUTPUT"
              ;;
            prod)
              test -n "$PRODUCTION_HOOK" || { echo "::error::RENDER_PRISM_API_PRODUCTION_DEPLOY_HOOK_URL is required"; exit 1; }
              test -n "$PRODUCTION_URL" || { echo "::error::PRISM_API_PRODUCTION_URL is required"; exit 1; }
              echo "production_ready=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unsupported deployment branch: $HEAD_BRANCH"
              exit 1
              ;;
          esac

  deploy-api-staging:
    needs: check-deploy-secrets
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'staging' &&
      needs.check-deploy-secrets.outputs.staging_ready == 'true'
    uses: The-Team-CG/.github/.github/workflows/deploy-render.yml@v2
    with:
      environment: staging
      ref: ${{ github.event.workflow_run.head_sha }}
      image_name: the-team-cg/prism-api
      dockerfile: Dockerfile
      docker_target: api
      health_url: ${{ vars.PRISM_API_STAGING_URL }}/health
    secrets:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRISM_API_STAGING_DEPLOY_HOOK_URL }}

  deploy-api-production:
    needs: check-deploy-secrets
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'prod' &&
      needs.check-deploy-secrets.outputs.production_ready == 'true'
    uses: The-Team-CG/.github/.github/workflows/deploy-render.yml@v2
    with:
      environment: production
      ref: ${{ github.event.workflow_run.head_sha }}
      image_name: the-team-cg/prism-api
      dockerfile: Dockerfile
      docker_target: api
      health_url: ${{ vars.PRISM_API_PRODUCTION_URL }}/health
    secrets:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRISM_API_PRODUCTION_DEPLOY_HOOK_URL }}

  deploy-frontend-client-staging:
    needs: deploy-api-staging
    if: >-
      needs.deploy-api-staging.result == 'success' &&
      github.event.workflow_run.head_branch == 'staging' &&
      vars.PRISM_VERCEL_PROJECT_ID_CLIENT != ''
    uses: The-Team-CG/.github/.github/workflows/deploy-vercel.yml@v2
    with:
      environment: staging
      ref: ${{ github.event.workflow_run.head_sha }}
      working_directory: apps/client
      node_version: "24"
      vercel_project_id: ${{ vars.PRISM_VERCEL_PROJECT_ID_CLIENT }}
      run_smoke: true
      smoke_path: /
    secrets: inherit

  deploy-frontend-event-staging:
    needs: deploy-api-staging
    if: >-
      needs.deploy-api-staging.result == 'success' &&
      github.event.workflow_run.head_branch == 'staging' &&
      vars.PRISM_VERCEL_PROJECT_ID_EVENT != ''
    uses: The-Team-CG/.github/.github/workflows/deploy-vercel.yml@v2
    with:
      environment: staging
      ref: ${{ github.event.workflow_run.head_sha }}
      working_directory: apps/event
      node_version: "24"
      vercel_project_id: ${{ vars.PRISM_VERCEL_PROJECT_ID_EVENT }}
      run_smoke: true
      smoke_path: /
    secrets: inherit

  deploy-frontend-guest-staging:
    needs: deploy-api-staging
    if: >-
      needs.deploy-api-staging.result == 'success' &&
      github.event.workflow_run.head_branch == 'staging' &&
      vars.PRISM_VERCEL_PROJECT_ID_GUEST != ''
    uses: The-Team-CG/.github/.github/workflows/deploy-vercel.yml@v2
    with:
      environment: staging
      ref: ${{ github.event.workflow_run.head_sha }}
      working_directory: apps/guest
      node_version: "24"
      vercel_project_id: ${{ vars.PRISM_VERCEL_PROJECT_ID_GUEST }}
      run_smoke: true
      smoke_path: /
    secrets: inherit

  deploy-frontend-supplier-staging:
    needs: deploy-api-staging
    if: >-
      needs.deploy-api-staging.result == 'success' &&
      github.event.workflow_run.head_branch == 'staging' &&
      vars.PRISM_VERCEL_PROJECT_ID_SUPPLIER != ''
    uses: The-Team-CG/.github/.github/workflows/deploy-vercel.yml@v2
    with:
      environment: staging
      ref: ${{ github.event.workflow_run.head_sha }}
      working_directory: apps/supplier
      node_version: "24"
      vercel_project_id: ${{ vars.PRISM_VERCEL_PROJECT_ID_SUPPLIER }}
      run_smoke: true
      smoke_path: /
    secrets: inherit

  deploy-frontend-client-production:
    needs: deploy-api-production
    if: >-
      needs.deploy-api-production.result == 'success' &&
      github.event.workflow_run.head_branch == 'prod' &&
      vars.PRISM_VERCEL_PROJECT_ID_CLIENT != ''
    uses: The-Team-CG/.github/.github/workflows/deploy-vercel.yml@v2
    with:
      environment: production
      ref: ${{ github.event.workflow_run.head_sha }}
      working_directory: apps/client
      node_version: "24"
      vercel_project_id: ${{ vars.PRISM_VERCEL_PROJECT_ID_CLIENT }}
      run_smoke: true
      smoke_path: /
    secrets: inherit

  deploy-frontend-event-production:
    needs: deploy-api-production
    if: >-
      needs.deploy-api-production.result == 'success' &&
      github.event.workflow_run.head_branch == 'prod' &&
      vars.PRISM_VERCEL_PROJECT_ID_EVENT != ''
    uses: The-Team-CG/.github/.github/workflows/deploy-vercel.yml@v2
    with:
      environment: production
      ref: ${{ github.event.workflow_run.head_sha }}
      working_directory: apps/event
      node_version: "24"
      vercel_project_id: ${{ vars.PRISM_VERCEL_PROJECT_ID_EVENT }}
      run_smoke: true
      smoke_path: /
    secrets: inherit

  deploy-frontend-guest-production:
    needs: deploy-api-production
    if: >-
      needs.deploy-api-production.result == 'success' &&
      github.event.workflow_run.head_branch == 'prod' &&
      vars.PRISM_VERCEL_PROJECT_ID_GUEST != ''
    uses: The-Team-CG/.github/.github/workflows/deploy-vercel.yml@v2
    with:
      environment: production
      ref: ${{ github.event.workflow_run.head_sha }}
      working_directory: apps/guest
      node_version: "24"
      vercel_project_id: ${{ vars.PRISM_VERCEL_PROJECT_ID_GUEST }}
      run_smoke: true
      smoke_path: /
    secrets: inherit

  deploy-frontend-supplier-production:
    needs: deploy-api-production
    if: >-
      needs.deploy-api-production.result == 'success' &&
      github.event.workflow_run.head_branch == 'prod' &&
      vars.PRISM_VERCEL_PROJECT_ID_SUPPLIER != ''
    uses: The-Team-CG/.github/.github/workflows/deploy-vercel.yml@v2
    with:
      environment: production
      ref: ${{ github.event.workflow_run.head_sha }}
      working_directory: apps/supplier
      node_version: "24"
      vercel_project_id: ${{ vars.PRISM_VERCEL_PROJECT_ID_SUPPLIER }}
      run_smoke: true
      smoke_path: /
    secrets: inherit
