name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  check-deploy-secrets:
    runs-on: ubuntu-latest
    outputs:
      staging_ready: ${{ steps.check.outputs.staging_ready }}
      production_ready: ${{ steps.check.outputs.production_ready }}
    steps:
      - id: check
        env:
          STAGING_HOOK: ${{ secrets.RENDER_PRISM_API_STAGING_DEPLOY_HOOK_URL }}
          PRODUCTION_HOOK: ${{ secrets.RENDER_PRISM_API_PRODUCTION_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$STAGING_HOOK" ] && [ -n "${{ vars.PRISM_API_STAGING_URL }}" ]; then
            echo "staging_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "staging_ready=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$PRODUCTION_HOOK" ] && [ -n "${{ vars.PRISM_API_PRODUCTION_URL }}" ]; then
            echo "production_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "production_ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-api-staging:
    needs: check-deploy-secrets
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'staging' &&
      needs.check-deploy-secrets.outputs.staging_ready == 'true'
    uses: The-Team-CG/.github/.github/workflows/deploy-render.yml@main
    with:
      environment: staging
      ref: ${{ github.event.workflow_run.head_sha }}
      image_name: the-team-cg/prism-api
      dockerfile: Dockerfile
      docker_target: api
      health_url: ${{ vars.PRISM_API_STAGING_URL }}/health
    secrets:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRISM_API_STAGING_DEPLOY_HOOK_URL }}

  deploy-api-production:
    needs: check-deploy-secrets
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      needs.check-deploy-secrets.outputs.production_ready == 'true'
    uses: The-Team-CG/.github/.github/workflows/deploy-render.yml@main
    with:
      environment: production
      ref: ${{ github.event.workflow_run.head_sha }}
      image_name: the-team-cg/prism-api
      dockerfile: Dockerfile
      docker_target: api
      health_url: ${{ vars.PRISM_API_PRODUCTION_URL }}/health
    secrets:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRISM_API_PRODUCTION_DEPLOY_HOOK_URL }}

  deploy-frontends-staging:
    needs: deploy-api-staging
    if: >-
      needs.deploy-api-staging.result == 'success' &&
      github.event.workflow_run.head_branch == 'staging' &&
      vars[matrix.project_var] != ''
    strategy:
      matrix:
        include:
          - app: client
            project_var: PRISM_VERCEL_PROJECT_ID_CLIENT
          - app: event
            project_var: PRISM_VERCEL_PROJECT_ID_EVENT
          - app: guest
            project_var: PRISM_VERCEL_PROJECT_ID_GUEST
          - app: supplier
            project_var: PRISM_VERCEL_PROJECT_ID_SUPPLIER
    uses: The-Team-CG/.github/.github/workflows/deploy-vercel.yml@main
    with:
      environment: staging
      ref: ${{ github.event.workflow_run.head_sha }}
      working_directory: apps/${{ matrix.app }}
      node_version: "24"
      vercel_project_id: ${{ vars[matrix.project_var] }}
      run_smoke: true
      smoke_path: /
    secrets: inherit

  deploy-frontends-production:
    needs: deploy-api-production
    if: >-
      needs.deploy-api-production.result == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars[matrix.project_var] != ''
    strategy:
      matrix:
        include:
          - app: client
            project_var: PRISM_VERCEL_PROJECT_ID_CLIENT
          - app: event
            project_var: PRISM_VERCEL_PROJECT_ID_EVENT
          - app: guest
            project_var: PRISM_VERCEL_PROJECT_ID_GUEST
          - app: supplier
            project_var: PRISM_VERCEL_PROJECT_ID_SUPPLIER
    uses: The-Team-CG/.github/.github/workflows/deploy-vercel.yml@main
    with:
      environment: production
      ref: ${{ github.event.workflow_run.head_sha }}
      working_directory: apps/${{ matrix.app }}
      node_version: "24"
      vercel_project_id: ${{ vars[matrix.project_var] }}
      run_smoke: true
      smoke_path: /
    secrets: inherit
