# Local infrastructure only. Application migrations live in apps/api/prisma.
# Startup renders project identity and ports into .local-dev/supabase/supabase/config.toml.
project_id = "prism-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329

[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = false
site_url = "http://127.0.0.1:3001"

[storage]
enabled = false

[realtime]
enabled = false

[local_smtp]
enabled = false
port = 54324

[analytics]
enabled = false

[edge_runtime]
enabled = false
