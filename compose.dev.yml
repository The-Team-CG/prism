name: prism-dev

x-dev-service: &dev-service
  image: prism-dev:local
  build:
    context: .
    dockerfile: Dockerfile
    target: dev
  init: true
  environment:
    NODE_ENV: development
    NEXT_TELEMETRY_DISABLED: "1"
    NEXT_PUBLIC_API_URL: http://localhost:4000
    NEXT_PUBLIC_PRISM_API_BASE_URL: http://localhost:4000/api
    NEXT_PUBLIC_CLIENT_PORTAL_URL: http://localhost:3001
    NEXT_PUBLIC_SUPPLIER_PORTAL_URL: http://localhost:3002
    NEXT_PUBLIC_GUEST_PORTAL_URL: http://localhost:3003
    NEXT_PUBLIC_EVENT_PORTAL_URL: http://localhost:3004
  develop:
    watch:
      - action: sync
        path: ./apps
        target: /app/apps
        initial_sync: true
        ignore: ["**/node_modules/", "**/.next/", "**/dist/", "**/.env*", "**/package.json", "**/*.tsbuildinfo"]
      - action: sync
        path: ./packages
        target: /app/packages
        initial_sync: true
        ignore: ["**/node_modules/", "**/dist/", "**/package.json", "**/*.tsbuildinfo"]
      - action: sync
        path: ./scripts
        target: /app/scripts
# Dependency changes: rerun start-prism-docker.cmd -Dev to rebuild the shared image once.

services:
  api:
    <<: *dev-service
    env_file: .local-dev/docker.env
    environment:
      NODE_ENV: development
      PRISM_ENV_FILE: /dev/null
      PORT: 4000
      CORS_ORIGIN: http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004
      PRISM_DISABLE_CONFORME_REMINDER_JOB: "1"
    command: ["node", "scripts/docker-dev.mjs", "api"]
    ports: ["127.0.0.1:4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  client:
    <<: *dev-service
    command: ["node", "scripts/docker-dev.mjs", "client"]
    ports: ["127.0.0.1:3001:3001"]
    volumes: ["client-next:/app/apps/client/.next"]
    depends_on: {api: {condition: service_healthy}}
  supplier:
    <<: *dev-service
    command: ["node", "scripts/docker-dev.mjs", "supplier"]
    ports: ["127.0.0.1:3002:3002"]
    volumes: ["supplier-next:/app/apps/supplier/.next"]
    depends_on: {api: {condition: service_healthy}}
  guest:
    <<: *dev-service
    command: ["node", "scripts/docker-dev.mjs", "guest"]
    ports: ["127.0.0.1:3003:3003"]
    volumes: ["guest-next:/app/apps/guest/.next"]
    depends_on: {api: {condition: service_healthy}}
  event:
    <<: *dev-service
    command: ["node", "scripts/docker-dev.mjs", "event"]
    ports: ["127.0.0.1:3004:3004"]
    volumes: ["event-next:/app/apps/event/.next"]
    depends_on: {api: {condition: service_healthy}}

volumes:
  client-next:
  supplier-next:
  guest-next:
  event-next:
