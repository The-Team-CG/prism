name: prism-local

x-web-service: &web-service
  build:
    context: .
    dockerfile: Dockerfile
    target: web
  environment:
    NEXT_PUBLIC_API_URL: http://localhost:4000
    NEXT_PUBLIC_PRISM_API_BASE_URL: http://localhost:4000/api
  depends_on:
    api:
      condition: service_started

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file:
      - path: .env.docker
        required: false
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004
      PRISM_DISABLE_CONFORME_REMINDER_JOB: "1"
    ports:
      - "4000:4000"

  client:
    <<: *web-service
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        WORKSPACE: "@prism/client"
        PORT: "3001"
    ports:
      - "3001:3001"

  supplier:
    <<: *web-service
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        WORKSPACE: "@prism/supplier"
        PORT: "3002"
    ports:
      - "3002:3002"

  guest:
    <<: *web-service
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        WORKSPACE: "@prism/guest"
        PORT: "3003"
    ports:
      - "3003:3003"

  event:
    <<: *web-service
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        WORKSPACE: "@prism/event"
        PORT: "3004"
    ports:
      - "3004:3004"
