name: prism-local

x-web-service: &web-service
  build:
    context: .
    dockerfile: Dockerfile
    target: web
  init: true
  environment:
    NEXT_PUBLIC_API_URL: http://localhost:4000
    NEXT_PUBLIC_PRISM_API_BASE_URL: http://localhost:4000/api
    NEXT_PUBLIC_CLIENT_PORTAL_URL: http://localhost:3001
    NEXT_PUBLIC_SUPPLIER_PORTAL_URL: http://localhost:3002
    NEXT_PUBLIC_GUEST_PORTAL_URL: http://localhost:3003
    NEXT_PUBLIC_EVENT_PORTAL_URL: http://localhost:3004
  depends_on:
    api:
      condition: service_healthy

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    init: true
    env_file: .local-dev/docker.env
    environment:
      NODE_ENV: production
      PRISM_ENV_FILE: /dev/null
      PORT: 4000
      CORS_ORIGIN: http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004
      PRISM_DISABLE_CONFORME_REMINDER_JOB: "1"
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  client:
    <<: *web-service
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        APP: "client"
        NEXT_PUBLIC_CLIENT_PORTAL_URL: http://localhost:3001
        NEXT_PUBLIC_SUPPLIER_PORTAL_URL: http://localhost:3002
        NEXT_PUBLIC_GUEST_PORTAL_URL: http://localhost:3003
        NEXT_PUBLIC_EVENT_PORTAL_URL: http://localhost:3004
        PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"

  supplier:
    <<: *web-service
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        APP: "supplier"
        NEXT_PUBLIC_CLIENT_PORTAL_URL: http://localhost:3001
        NEXT_PUBLIC_SUPPLIER_PORTAL_URL: http://localhost:3002
        NEXT_PUBLIC_GUEST_PORTAL_URL: http://localhost:3003
        NEXT_PUBLIC_EVENT_PORTAL_URL: http://localhost:3004
        PORT: "3002"
    ports:
      - "127.0.0.1:3002:3002"

  guest:
    <<: *web-service
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        APP: "guest"
        NEXT_PUBLIC_CLIENT_PORTAL_URL: http://localhost:3001
        NEXT_PUBLIC_SUPPLIER_PORTAL_URL: http://localhost:3002
        NEXT_PUBLIC_GUEST_PORTAL_URL: http://localhost:3003
        NEXT_PUBLIC_EVENT_PORTAL_URL: http://localhost:3004
        PORT: "3003"
    ports:
      - "127.0.0.1:3003:3003"

  event:
    <<: *web-service
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        APP: "event"
        NEXT_PUBLIC_CLIENT_PORTAL_URL: http://localhost:3001
        NEXT_PUBLIC_SUPPLIER_PORTAL_URL: http://localhost:3002
        NEXT_PUBLIC_GUEST_PORTAL_URL: http://localhost:3003
        NEXT_PUBLIC_EVENT_PORTAL_URL: http://localhost:3004
        PORT: "3004"
    ports:
      - "127.0.0.1:3004:3004"
